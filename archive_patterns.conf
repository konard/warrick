# Archive Patterns Configuration File
# Used by Warrick to identify and remove archive-specific URI patterns
# and branding elements when reconstructing websites
#
# Format:
# [SECTION_NAME]
# type = uri_rewrite|branding_removal
# pattern = regex_pattern_or_sed_expression
# description = human-readable description
#
# For uri_rewrite patterns, use sed-style substitution patterns
# For branding_removal patterns, use Perl regex patterns

# Wayback Machine (Internet Archive) - URI Rewriting
[wayback_archive_org]
type = uri_rewrite
pattern = s/\.wstub.archive.org\/\.\\//g
description = Remove Wayback stub archive references

[wayback_archive_it]
type = uri_rewrite
pattern = s/http:\\/\\/wayback.archive\-it.org\\/[0-9]*\\/[0-9a-z]*.\\///g
description = Remove Archive-It wayback references

# Library of Congress Web Archive
[loc_webarchive]
type = uri_rewrite
pattern = s/http:\\/\\/webarchive.loc.gov\\/.\\/*\\///g
description = Remove Library of Congress web archive references

# UK Web Archive
[uk_webarchive]
type = uri_rewrite
pattern = s/http:\\/\\/www.webarchive.org.uk\\/wayback\\/archive\\/[0-9a-z]*\\///g
description = Remove UK Web Archive references (version 1)

[uk_webarchive_v2]
type = uri_rewrite
pattern = s/http:\\/\\/www.webarchive.org.uk\\/wayback\\/archive\\/[0-9]*\///g
description = Remove UK Web Archive references (version 2)

# Library and Archives Canada
[collections_canada]
type = uri_rewrite
pattern = s/http:\\/\\/collectionscanada.gc.ca\\/pam_archives\\/index.php?//g
description = Remove Collections Canada archive references

# WebCite
[webcitation]
type = uri_rewrite
pattern = s/http:\\/\\/www.webcitation.org\\/getfile\\?fileid=[0-9a-z]*.//g
description = Remove WebCitation references

# Google Cache
[google_cache]
type = uri_rewrite
pattern = s/http:\\/\\/webcache.googleusercontent.com\\/search?q=cache:.//g
description = Remove Google Cache references

# Bing Cache
[bing_cache]
type = uri_rewrite
pattern = s/http:\\/\\/cc.bingj.com\\/cache.aspx?//g
description = Remove Bing Cache references

[yahoo_cache]
type = uri_rewrite
pattern = s/http:\\/\\/74\\.6\\.238\\.254\\/search\\/srpcache?//g
description = Remove Yahoo Cache references

# US Government Web Harvest
[webharvest_gov]
type = uri_rewrite
pattern = s/ http:\\/\\/webharvest.gov\\/congress110th\\/xmlquery?//g
description = Remove US Government Web Harvest references

# California Digital Library
[cdlib_webarchives]
type = uri_rewrite
pattern = s/http:\\/\\/webarchives.cdlib.org\\///g
description = Remove CDLib web archives references

# Diigo
[diigo_cache]
type = uri_rewrite
pattern = s/http:\\/\\/www.diigo.com\\/cached\\/showpage\\/upload?//g
description = Remove Diigo cache references

# Wayback API
[wayback_api]
type = uri_rewrite
pattern = s/http:\\/\\/api.wayback.archive.org\\/list\\/timemap\\/link\\///g
description = Remove Wayback API timemap references

# Internet Archive - Branding Removal
[ia_disclaim_js]
type = branding_removal
pattern = <script type=\"text\/javascript\" src=\"http:\/\/staticweb\.archive\.org\/js\/disclaim.js\"><\/script>
description = Remove Internet Archive disclaimer JavaScript

[ia_wmnotice]
type = branding_removal
pattern = var wmNotice.+\n
description = Remove Wayback Machine notice variable

[ia_wmhide]
type = branding_removal
pattern = var wmHide.+\n
description = Remove Wayback Machine hide variable

[ia_toolbar]
type = branding_removal
pattern = <!-- BEGIN WAYBACK TOOLBAR INSERT -->.*<!-- END WAYBACK TOOLBAR INSERT -->
flags = sgi
description = Remove Wayback toolbar (multiline)

[ia_rewrite_js]
type = branding_removal
pattern = <!-- Start Wayback Rewrite JS Include -->.*<!-- End Wayback Rewrite JS Include -->
flags = sgi
description = Remove Wayback rewrite JavaScript include (multiline)

[ia_archived_notice]
type = branding_removal
pattern = <!--\s*FILE ARCHIVED ON.*All versions<\/a> of this archived page\.
flags = sgi
description = Remove Internet Archive file archived notice (multiline)

[ia_classic_web]
type = branding_removal
pattern = classic-web.archive.org.*var sWayBackCGI
description = Remove classic web archive CGI variable (line removal)

# WebCite - Branding Removal
[webcite_content_type]
type = branding_removal
pattern = Content\-Type\: text\/html
description = Remove WebCite content type header

# Google Cache - Branding Removal
[google_base_href]
type = branding_removal
pattern = <base href=\".*\n
flags = gi
description = Remove Google cache base href

[google_nbsp_div]
type = branding_removal
pattern = <div>\&nbsp;<\/div><\/div><\/div><div style\=\"position:relative\">
flags = gi
description = Remove Google cache spacing div

[google_meta_utf8]
type = branding_removal
pattern = <meta http\-equiv\=\"Content\-Type\" content\=\"text\/html; charset\=UTF\-8\">
flags = gi
description = Remove Google cache UTF-8 meta tag

# National Archives - Branding Removal
[nara_logo]
type = branding_removal
pattern = <div id\=\"webArchiveLogo\".*<\/noscript><\/div>\s*<\/div>
flags = sgi
description = Remove National Archives logo div (multiline)

# Generic Archive - Branding Removal
[generic_base_href]
type = branding_removal
pattern = <base href=\".*\n
flags = gi
description = Remove generic base href tags
